name: Build Windows App Image

on:
  workflow_dispatch:
    inputs:
      appVersion:
        description: "Application version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      appName:
        description: "Application name"
        required: true
        default: "CobolAssistant"

permissions:
  contents: read

jobs:
  build-app-image:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build portable app-image with Maven
        shell: bash
        run: >-
          mvn -B clean package -DskipTests -Pwindows-app-image
          -Dapp.name="${{ github.event.inputs.appName }}"
          -Dapp.version="${{ github.event.inputs.appVersion }}"
          -Dapp.vendor="${{ github.repository_owner }}"

      - name: Upload app-image artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-image
          path: target/dist/**
          if-no-files-found: error
