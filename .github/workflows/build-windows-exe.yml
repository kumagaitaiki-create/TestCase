name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      appVersion:
        description: "Application version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      appName:
        description: "Application name"
        required: true
        default: "CobolAssistant"

permissions:
  contents: read

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install WiX Toolset
        shell: bash
        run: choco install wixtoolset --no-progress -y

      - name: Build and package EXE with Maven
        shell: bash
        run: >-
          mvn -B clean package -DskipTests -Pwindows-exe
          -Dapp.name="${{ github.event.inputs.appName }}"
          -Dapp.version="${{ github.event.inputs.appVersion }}"
          -Dapp.vendor="${{ github.repository_owner }}"

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: target/dist/*.exe
          if-no-files-found: error
